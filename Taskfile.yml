version: "3"

vars:
  GOLANGCI_LINT_VERSION: "2.15.0"
  COMPOSE: docker compose --env-file backend/.env

# Local configuration (copy backend/.env.example). A missing file is ignored;
# variables already set in the shell take precedence.
dotenv: ["backend/.env"]

tasks:
  deps:up:
    desc: Start PostgreSQL and the local S3 service and wait until both are healthy
    preconditions: &env-file
      - sh: test -f backend/.env
        msg: "backend/.env is missing: run `Copy-Item backend/.env.example backend/.env`"
    cmds:
      - "{{.COMPOSE}} up -d --wait --wait-timeout 120"

  deps:down:
    desc: Stop the local dependencies (data is kept)
    preconditions: *env-file
    cmds:
      - "{{.COMPOSE}} down"

  deps:status:
    desc: Show the local dependencies and their health
    preconditions: *env-file
    cmds:
      - "{{.COMPOSE}} ps --all"

  deps:logs:
    desc: Follow the logs of the local dependencies
    preconditions: *env-file
    cmds:
      - "{{.COMPOSE}} logs -f"

  deps:reset:
    desc: Delete all local PostgreSQL and object-storage data
    prompt: This permanently deletes the local database and bucket contents. Continue?
    preconditions: *env-file
    cmds:
      - "{{.COMPOSE}} down --volumes"

  dev:api:
    desc: Run the API on http://127.0.0.1:8080
    dir: backend
    cmds:
      - go run ./cmd/api

  dev:worker:
    desc: Run the background worker
    dir: backend
    cmds:
      - go run ./cmd/worker

  dev:web:
    desc: Run the Vite dev server on http://localhost:5173
    dir: frontend
    cmds:
      - pnpm dev

  test:
    desc: Run backend and frontend tests
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    dir: backend
    cmds:
      - go test ./...

  test:web:
    dir: frontend
    cmds:
      - pnpm test

  lint:
    desc: Check the golangci-lint version, then lint backend and frontend
    cmds:
      - task: lint:go-version
      - task: lint:go
      - task: lint:web

  lint:go-version:
    silent: true
    cmds:
      - |
        actual="$(golangci-lint version)"
        case "$actual" in
          *"version {{.GOLANGCI_LINT_VERSION}} "*) ;;
          *)
            echo "golangci-lint {{.GOLANGCI_LINT_VERSION}} is required, found: $actual"
            exit 1
            ;;
        esac

  lint:go:
    dir: backend
    cmds:
      - golangci-lint config verify --config .golangci.yml
      - golangci-lint run --config .golangci.yml ./...

  lint:web:
    dir: frontend
    cmds:
      - pnpm lint

  fmt:
    desc: Format backend and frontend code
    cmds:
      - task: fmt:go
      - task: fmt:web

  fmt:go:
    dir: backend
    cmds:
      - golangci-lint fmt --config .golangci.yml

  fmt:web:
    dir: frontend
    cmds:
      - pnpm format

  build:
    desc: Build the backend binaries and the frontend bundle
    cmds:
      - task: build:go
      - task: build:web

  build:go:
    dir: backend
    cmds:
      - go build -o bin/ ./cmd/...

  build:web:
    dir: frontend
    cmds:
      - pnpm build
