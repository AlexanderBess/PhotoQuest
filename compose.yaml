# Local development dependencies (PQ-003). The API, worker and frontend run
# natively through `task dev:*`; this file only provides PostgreSQL and a
# local S3-compatible object store.
#
# Values come from backend/.env (copy backend/.env.example). Start with
# `task deps:up`; see docs/development/setup.md.
#
# Images are pinned by tag and digest. Ports bind to 127.0.0.1 only.

name: photoquest

services:
  postgres:
    # PostgreSQL 18 (D-17 / OD-17, decided in PQ-003).
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: ${PQ_DB_USER:?set PQ_DB_USER in backend/.env}
      POSTGRES_PASSWORD: ${PQ_DB_PASSWORD:?set PQ_DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${PQ_DB_NAME:?set PQ_DB_NAME in backend/.env}
      # UTF-8 with the language-neutral ICU root collation. Changing this
      # later requires re-creating the database (task deps:reset).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=und
    ports:
      - "127.0.0.1:${PQ_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # TCP on 127.0.0.1, so it does not pass while the init-only server
      # (Unix socket only) is running.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  storage:
    # PROVISIONAL local S3-compatible service (OD-13 stays open): SeaweedFS
    # in single-process "mini" mode. PQ-007 confirms or replaces it after the
    # provider compatibility checks.
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${PQ_S3_ACCESS_KEY_ID:?set PQ_S3_ACCESS_KEY_ID in backend/.env}
      AWS_SECRET_ACCESS_KEY: ${PQ_S3_SECRET_ACCESS_KEY:?set PQ_S3_SECRET_ACCESS_KEY in backend/.env}
      # Private bucket created on startup if it does not exist.
      S3_BUCKET: ${PQ_S3_BUCKET:?set PQ_S3_BUCKET in backend/.env}
    ports:
      # Only the S3 API is published; the admin UI and internal ports are not.
      - "127.0.0.1:${PQ_S3_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      # A signed HEAD on the bucket proves the gateway is up, the credentials
      # work and the bucket exists.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -I --aws-sigv4 aws:amz:us-east-1:s3 -u \"$${AWS_ACCESS_KEY_ID}:$${AWS_SECRET_ACCESS_KEY}\" \"http://127.0.0.1:8333/$${S3_BUCKET}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  storage-data:
